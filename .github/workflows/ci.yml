name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_ios:
        description: Run the native check on an isolated GitHub-hosted macOS runner
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/tool
      - run: flutter analyze
      - run: flutter test
      - name: Analyze example
        working-directory: example
        run: flutter analyze --no-pub
      - name: Test example
        working-directory: example
        run: flutter test --no-pub

  native_ios:
    name: iOS native host (manual)
    # Native checks are manual and need a compatible iOS SDK. Use a fresh hosted
    # machine so public contributions never run on a persistent host.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.native_ios &&
      github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: false
      - name: Compile and inspect a disposable iOS host
        run: bash tool/build_ios_host.sh
