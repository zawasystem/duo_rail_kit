name: Publish to pub.dev

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: publish-pub-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minimum_sdk:
    name: Minimum Flutter SDK (analyze + test)
    if: github.repository == 'zawasystem/duo_rail_kit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The flutter lower bound in pubspec.yaml.
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Analyze example
        working-directory: example
        run: flutter analyze --no-pub
      - name: Test example
        working-directory: example
        run: flutter test --no-pub

  validate:
    name: Release validation (format, analyze, test, dry run)
    if: github.repository == 'zawasystem/duo_rail_kit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # The development SDK (.fvmrc). The publish job installs the same
          # version; update them together.
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/tool
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Analyze example
        working-directory: example
        run: flutter analyze --no-pub
      - name: Test example
        working-directory: example
        run: flutter test --no-pub
      - name: Validate publication archive
        run: flutter pub publish --dry-run

  # This job can request the OIDC token, so it uses no third-party actions (only
  # the Flutter SDK and GitHub's and the Dart team's actions); the checks run in
  # the jobs it needs.
  publish:
    needs: [minimum_sdk, validate]
    if: github.repository == 'zawasystem/duo_rail_kit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          manifest = Path('pubspec.yaml').read_text()
          versions = re.findall(r'^version:[^\r\n]*$', manifest, re.MULTILINE)
          match = re.fullmatch(r"version:[ \t]*(['\"]?)([0-9]+\.[0-9]+\.[0-9]+)\1[ \t]*(?:#.*)?", versions[0]) if len(versions) == 1 else None
          if match is None or match.group(2) != os.environ['RELEASE_TAG']:
              raise SystemExit('Release tag must match the stable version in pubspec.yaml.')
          if not re.search(r'^name: duo_rail_kit[ \t]*$', manifest, re.MULTILINE):
              raise SystemExit('Unexpected package name.')
          PY
      - name: Install Flutter SDK
        # The SDK of the validate job's dry run (.fvmrc); FLUTTER_COMMIT is that
        # tag's commit. Update them together. The SDK's first run and the
        # package's dependencies are set up here, before the token exists.
        env:
          FLUTTER_TAG: 3.47.9
          FLUTTER_COMMIT: c197ca5199e9ee5661e865596c9c07294dfab51c
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$FLUTTER_TAG" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          if [ "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" != "$FLUTTER_COMMIT" ]; then
            echo "Flutter tag $FLUTTER_TAG does not point to the reviewed commit $FLUTTER_COMMIT." >&2
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/flutter" pub get
      # The Dart team's action configures the short-lived pub.dev token from
      # GitHub OIDC, so only the publish step follows it.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.7'
      - name: Publish
        run: flutter pub publish --force
